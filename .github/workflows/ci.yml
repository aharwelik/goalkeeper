name: ci
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: syntax check
        run: for f in src/*.js bin/*.js test/*.mjs; do node --check "$f"; done

      - name: test (offline, no API key)
        run: node test/run.mjs
